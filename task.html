<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" conten
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="task.css">
    
</head>
<body>
    <div class="card-container" style="display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; padding: 40px;">

    <!-- Card 1 -->
    <div class="card">
        <input type="checkbox" id="promo-1" class="hidden-trigger">
        <label for="promo-1" class="card-inner">
            <div class="card-front" style="background-image: linear-gradient(40deg,rgba(217, 160, 100, 0.4), rgba(79, 165, 230, 0.6)), url('https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800&q=80');">
                <h2>Echo Pro ANC</h2>
            </div>
            <div class="card-back">
                <h3>Studio-grade isolation.</h3>
                <p>40-hour battery life, aerospace-grade aluminum build, and spatial audio support.</p>
            </div>
        </label>
    </div>

    <!-- Card 2 -->
    <div class="card">
        <input type="checkbox" id="promo-2" class="hidden-trigger">
        <label for="promo-2" class="card-inner">
            <div class="card-front" style="background-image: linear-gradient(40deg,rgba(40, 180, 133, 0.4), rgba(30, 100, 170, 0.6)), url('https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=800&q=80');">
                <h2>Nomad Pack</h2>
            </div>
            <div class="card-back">
                <h3>The ultimate daily carry.</h3>
                <p>Weatherproof ballistic nylon, hidden RFID-safe pockets, and an integrated USB-C charging hub.</p>
            </div>
        </label>
    </div>

    <!-- Card 3 -->
    <div class="card">
        <input type="checkbox" id="promo-3" class="hidden-trigger">
        <label for="promo-3" class="card-inner">
            <div class="card-front" style="background-image: linear-gradient(40deg,rgba(200, 80, 100, 0.4), rgba(50, 40, 80, 0.6)), url('https://images.unsplash.com/photo-1579586337278-3befd40fd17a?w=800&q=80');">
                <h2>Vitality Band</h2>
            </div>
            <div class="card-back">
                <h3>Invisible health tracking.</h3>
                <p>Monitor sleep stages, HRV, and daily recovery scores in a minimal, screen-free titanium band.</p>
            </div>
        </label>
    </div>

</div>
    
</body>
</html>
